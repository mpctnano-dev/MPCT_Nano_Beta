# MPaCT Lab Knowledge Base source.
# How to add a page and rebuild: see README.md
# `mkdocs build --strict` writes HTML into site/
# Later, copy site/ into the website folder as knowledge-base/
site_name: MPaCT Lab Knowledge Base
site_description: Guides to characterization and fabrication at NAU's MPaCT Lab in Flagstaff, Arizona. Start from a sample, a method, or a choice between methods.
site_author: NAU Nano

# site_url MUST match the deployed path. It drives canonical URLs and sitemap.xml.
site_url: https://nano.nau.edu/knowledge-base/

docs_dir: docs

theme:
  name: material
  custom_dir: overrides
  logo: assets/NAU.png
  favicon: assets/NAU_Nano_favicon.png
  features:
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - navigation.indexes
    # navigation.sections is deliberately OFF. It renders every top-level
    # section as a permanently expanded group, which put 31 links and 6
    # headings in the sidebar on every page. Tabs move the sections to a
    # horizontal strip so the sidebar carries only the current section.
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
    # navigation.instant is deliberately OFF. It swaps page bodies over XHR,
    # which desyncs the nano.nau.edu sticky header measured by JS/script.js.
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font: false

plugins:
  - search
  - tags
  - awesome-pages

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

# extra_css is deliberately NOT used. mkdocs emits it before the extrahead
# block, which put it ahead of nano.nau.edu's style.css - and style.css
# hard-sets body background and colour, overriding Material's dark-mode
# tokens. extra.css is linked last from overrides/main.html instead.

extra:
  generator: false
  social: []

copyright: Copyright &copy; 2026 Northern Arizona University.
